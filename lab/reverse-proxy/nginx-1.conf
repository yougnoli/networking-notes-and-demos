# The reverse proxy, replica 1. See docs/09-reverse-proxy-and-tls.md.
#
# By the time a request reaches here, the WAF has already:
#   - terminated TLS (this is plain HTTP from here on)
#   - decided the request is clean
#   - set X-Forwarded-For / X-Real-IP / X-Forwarded-Proto
#
# So this file deliberately does NOT re-set those headers — nginx's
# proxy_pass forwards incoming headers through unchanged by default
# unless you explicitly override them with proxy_set_header. Doing that
# here by accident (e.g. setting X-Forwarded-For to $remote_addr again)
# would silently clobber the WAF's value with THIS hop's own address —
# a genuinely common real-world bug. This file adds one clearly-new
# header of its own instead (X-Served-By), so you can tell the two kinds
# apart in docs/11's walkthrough.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr info;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://web1:8080;
            proxy_set_header Host $host;
            # Intentionally NOT setting X-Forwarded-For / X-Real-IP /
            # X-Forwarded-Proto here — see the file header comment above.
            proxy_set_header X-Served-By "reverse-proxy-1";
        }
    }
}
