# The reverse proxy, replica 2. Identical to nginx-1.conf except which
# web server it forwards to and the X-Served-By value — see that file
# for the full comments.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr info;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://web2:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Served-By "reverse-proxy-2";
        }
    }
}
