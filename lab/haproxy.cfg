# The load balancer. See docs/07-load-balancer.md.
#
# This runs in TCP (L4) mode for the main frontend: HAProxy never
# decrypts the HTTPS traffic passing through it, so it can balance
# encrypted connections without holding any certificate at all. That's
# also *why* it can't add an HTTP header like X-Forwarded-For itself —
# it never parses the request far enough to know where to put one.
#
# To still let the real client IP survive the trip (L4 passthrough
# normally loses it, replacing it with the load balancer's own IP), each
# backend line uses HAProxy's PROXY protocol (`send-proxy`): a small
# plaintext header prepended before the encrypted bytes, carrying the
# original source IP/port, which the WAF's nginx config knows how to
# read (see waf/nginx-1.conf's `proxy_protocol` + `real_ip_header`).

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  1m
    timeout server  1m

# ---------------------------------------------------------------------
# The public-facing entry point. The firewall's DNAT rule sends inbound
# traffic on port 8443 here, to port 443.
# ---------------------------------------------------------------------
frontend public_https
    bind *:443
    mode tcp
    default_backend waf_pool

backend waf_pool
    mode tcp
    balance roundrobin
    # check-send-proxy: health-check connections also carry the PROXY
    # protocol header, matching what real traffic sends — otherwise the
    # WAF's nginx (which expects that header on every connection) would
    # reject the bare health-check connections and mark both backends
    # down.
    server waf1 waf1:443 check check-send-proxy send-proxy
    server waf2 waf2:443 check check-send-proxy send-proxy

# ---------------------------------------------------------------------
# The stats dashboard. Deliberately NOT reachable through the firewall —
# there's no DNAT rule for port 8404 anywhere. This is the "internal
# only" resource used in the VPN demo (docs/06-vpn.md, docs/11).
# ---------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
