# The WAF, replica 1. See docs/08-waf.md for the concepts; this file is
# the real thing, fully commented so nothing about how it decides to
# block a request is hidden.
#
# What this WAF checks:
#   - the URL and query string (SQL injection, XSS, path traversal shapes)
#   - the User-Agent header (known attack tools, missing header entirely)
#   - request body size (a crude defense against oversized/abusive POSTs)
#
# What it deliberately does NOT check: the request BODY's content. Plain
# nginx can't reliably inspect a POST body without extra modules a real
# WAF (like ModSecurity) provides — see docs/08-waf.md for the honest
# version of this limitation.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr info;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Reject any request body over 1 MB outright.
    client_max_body_size 1m;

    # ---- detection "signatures" ---------------------------------------
    # Each `map` below is a lookup table: given an nginx variable (the
    # request URI, or a header), it sets a flag variable to 1 if any
    # regex matches, 0 otherwise. This runs on EVERY request, cheaply,
    # before anything gets proxied anywhere.

    #
    # A separator between SQL keywords can arrive three ways on the
    # wire — a literal space, a URL-encoded space (%20), or a "+" (the
    # query-string convention for a space) — so every place below that
    # needs "some whitespace" matches all three: (\s|%20|\+)+. Using
    # \s+ alone here would look for a literal space character and miss
    # the URL-encoded form real attack traffic almost always uses.

    map $request_uri $blocked_sqli {
        default 0;
        "~*(\%27|'|--|\%23|#).*?(or|and)(\s|%20|\+)+.*?="  1;  # e.g. ' OR '1'='1
        "~*union(\s|%20|\+)+select"                          1;  # UNION SELECT ...
        "~*select.+from"                                      1;  # SELECT ... FROM ...
        "~*drop(\s|%20|\+)+table"                             1;  # DROP TABLE ...
        "~*sleep\(\d+\)"                                      1;  # time-based blind SQLi
    }

    map $request_uri $blocked_xss {
        default 0;
        "~*<script"        1;
        "~*javascript:"     1;
        "~*onerror\s*="     1;
        "~*onload\s*="      1;
    }

    map $request_uri $blocked_traversal {
        default 0;
        "~*\.\./"        1;   # ../../../etc/passwd
        "~*\.\.\\\\"     1;   # ..\..\ (Windows-style)
        "~*/etc/passwd"  1;
    }

    map $http_user_agent $blocked_agent {
        default 0;
        "~*sqlmap"     1;
        "~*nikto"      1;
        "~*acunetix"   1;
        ""             1;   # a real browser always sends *some* User-Agent
    }

    server {
        # proxy_protocol here means: expect HAProxy's PROXY protocol
        # header on every connection (haproxy.cfg's `send-proxy` sends
        # it on both real traffic and health checks). Without this,
        # $remote_addr below would show the load balancer's IP instead
        # of the real original client — a very real gotcha with L4/TCP
        # passthrough load balancers. See docs/07-load-balancer.md.
        listen 443 ssl proxy_protocol;
        server_name _;

        ssl_certificate     /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Trust the PROXY protocol header only from the load balancer's
        # own subnet, and use it to recover the real client address into
        # $remote_addr (nginx's built-in realip module does this).
        set_real_ip_from 10.10.10.0/24;
        real_ip_header    proxy_protocol;

        # ---- the actual blocking logic ---------------------------------
        # If any signature matched, return 403 immediately. The request
        # never reaches proxy_pass — the reverse proxy and web server
        # never see it at all.
        if ($blocked_sqli)      { return 403 "blocked by WAF: looked like SQL injection\n"; }
        if ($blocked_xss)       { return 403 "blocked by WAF: looked like XSS\n"; }
        if ($blocked_traversal) { return 403 "blocked by WAF: looked like path traversal\n"; }
        if ($blocked_agent)     { return 403 "blocked by WAF: known scanner or missing User-Agent\n"; }

        location / {
            # TLS's job ends here — everything past this point is plain
            # HTTP on the private dmz network. See docs/09.
            proxy_pass http://reverse-proxy-1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
