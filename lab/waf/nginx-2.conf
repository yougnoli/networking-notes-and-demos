# The WAF, replica 2.
#
# Identical to nginx-1.conf in every respect except the very last line
# (proxy_pass points at reverse-proxy-2 instead of reverse-proxy-1) —
# kept as a fully separate, fully readable file rather than a shared
# template, on purpose: nothing about what this container does is
# generated or hidden behind variable substitution.
#
# See nginx-1.conf for line-by-line comments on every rule below.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr info;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    client_max_body_size 1m;

    # See nginx-1.conf for why every "whitespace" here is
    # (\s|%20|\+)+ rather than plain \s+.
    map $request_uri $blocked_sqli {
        default 0;
        "~*(\%27|'|--|\%23|#).*?(or|and)(\s|%20|\+)+.*?="  1;
        "~*union(\s|%20|\+)+select"                          1;
        "~*select.+from"                                      1;
        "~*drop(\s|%20|\+)+table"                             1;
        "~*sleep\(\d+\)"                                      1;
    }

    map $request_uri $blocked_xss {
        default 0;
        "~*<script"        1;
        "~*javascript:"     1;
        "~*onerror\s*="     1;
        "~*onload\s*="      1;
    }

    map $request_uri $blocked_traversal {
        default 0;
        "~*\.\./"        1;
        "~*\.\.\\\\"     1;
        "~*/etc/passwd"  1;
    }

    map $http_user_agent $blocked_agent {
        default 0;
        "~*sqlmap"     1;
        "~*nikto"      1;
        "~*acunetix"   1;
        ""             1;
    }

    server {
        listen 443 ssl proxy_protocol;
        server_name _;

        ssl_certificate     /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        set_real_ip_from 10.10.10.0/24;
        real_ip_header    proxy_protocol;

        if ($blocked_sqli)      { return 403 "blocked by WAF: looked like SQL injection\n"; }
        if ($blocked_xss)       { return 403 "blocked by WAF: looked like XSS\n"; }
        if ($blocked_traversal) { return 403 "blocked by WAF: looked like path traversal\n"; }
        if ($blocked_agent)     { return 403 "blocked by WAF: known scanner or missing User-Agent\n"; }

        location / {
            proxy_pass http://reverse-proxy-2:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
