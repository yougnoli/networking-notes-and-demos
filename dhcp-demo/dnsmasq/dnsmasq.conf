# The DHCP server for this demo. See docs/04-the-endpoint-nic-dhcp-gateway.md
# for what each of these actually configures on the client side.

# Only listen on our one interface — don't try to also serve DHCP/DNS on
# anything else this container might be attached to.
interface=eth0
bind-interfaces

# The pool of addresses we're allowed to hand out, the subnet mask, and
# the lease time. A real office network might use a 12-24 hour lease; we
# use the same here just to show it's a normal, deliberate choice, not
# something special about labs.
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h

# Option 3: the default gateway to hand to clients (docs/04's "default
# gateway" bullet). There's nothing actually routing beyond this address
# in this tiny demo — the point here is purely to show that the gateway
# is *told* to the client by DHCP, not discovered some other way.
dhcp-option=3,192.168.50.1

# Option 6: DNS server(s) to hand out. Also just for demonstration —
# nothing in this demo actually resolves anything.
dhcp-option=6,8.8.8.8

# Don't act as a DNS resolver ourselves (dnsmasq can do both DNS and
# DHCP; we only want the DHCP half for this demo, to keep the traffic
# capture focused on just the DORA handshake).
port=0

# Verbose logging of every DHCP transaction — this is what makes the
# Discover/Offer/Request/Ack handshake visible in `docker compose logs`.
log-dhcp
